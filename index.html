</style></head><body>
<header><h1>My Notebook <span aria-hidden="true">✿</span></h1>
<nav class="spaces" aria-label="Workspace"><button id="journalBtn" class="active">Journal</button><button id="notebookBtn">Notebook</button></nav>
<div class="tools"><button id="ballpoint" class="icon active" aria-label="Ballpoint pen" title="Ballpoint pen">✒</button><button id="graphite" class="icon" aria-label="Graphite pencil" title="Graphite pencil">✎</button><button id="eraser" class="icon" aria-label="Eraser" title="Eraser">⌫</button><button id="type" class="icon" aria-label="Typing" title="Typing">T</button>
<label class="label">Colour <select id="color" aria-label="Ink colour"><option value="#18221d">Black</option><option value="#244f91">Blue</option><option value="#405c49" selected>Dark green</option><option value="#9a3840">Red</option></select></label>
<label class="label">Width <input id="width" type="range" min=".5" max="10" step=".5" value="3"><output id="widthOut">3 px</output></label>
<label class="label"><input id="finger" type="checkbox"> Finger draw</label><button id="undo" class="icon" aria-label="Undo" title="Undo">↶</button><button id="redo" class="icon" aria-label="Redo" title="Redo">↷</button><button id="toolOptions" class="icon" aria-label="Pen options" title="Pen options">◉</button><button id="more" class="icon" aria-label="More options" title="More options">⋯</button><button id="print">Print / PDF</button><button id="backup">Backup</button><button id="restore">Restore</button><input id="restoreFile" type="file" accept="application/json" hidden><div id="toolPop" class="popover hide"><strong>Writing tool</strong><label>Thickness <input id="popWidth" type="range" min=".5" max="10" step=".5" value="3"></label><label>Colour <select id="popColor"><option value="#18221d">Black</option><option value="#244f91">Blue</option><option value="#405c49" selected>Dark green</option><option value="#9a3840">Red</option></select></label><label><input id="fingerPop" type="checkbox"> Enable finger drawing</label></div><div id="moreMenu" class="more hide"><button id="morePrint">Print / PDF</button><button id="moreBackup">Download backup</button><button id="moreRestore">Restore backup</button><button id="diagToggle">Input diagnostics</button></div></div></header>
<main class="wrap"><div class="controls"><div id="journalControls"><select id="journalEntries" aria-label="Journal entries"></select> <button id="newJournal">+ New entry</button> <select id="theme" aria-label="Journal theme"><option value="botanical">Botanical</option><option value="golden">Golden Hour</option><option value="woodland">English Woodland</option></select></div><div id="notebookControls" class="hide"><select id="notebooks" aria-label="Notebooks"></select> <button id="newNotebook">+ Notebook</button> <select id="pages" aria-label="Pages"></select> <button id="newPage">+ Page</button><select id="template" aria-label="Page template"><option value="blank">Blank</option><option value="ruled">Ruled</option><option value="grid">Square grid</option><option value="dotted">Dotted grid</option></select></div><button id="rename" class="hide">Rename notebook</button></div>
<section class="paper" id="paper"><svg class="art" viewBox="0 0 940 1000" preserveAspectRatio="none" aria-hidden="true"><g id="art"></g></svg><div class="page-head"><h2 id="pageTitle">My Journal</h2><div class="date" id="date"></div></div><div class="canvas-wrap" id="surface"><div id="templateLayer" class="template"></div><canvas id="canvas" aria-label="Writing surface"></canvas><textarea id="text" placeholder="Write your thoughts here..."></textarea></div><button id="bottomAdd" class="add-bottom hide">＋ Add page</button></section><div class="status" id="status">Pencil-only mode is on — draw with Apple Pencil</div><div id="diagnostics" class="diagnostics hide" aria-live="polite"></div><div class="foot">Saved locally on this device · Back up regularly</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{desynchronized:true}),KEY='my-notebook-v2',OLD='tesseratrix-my-journal-v1';let db,space='journal',page,tool='ballpoint',active=null,raf=0,dirty=[],undo=[],redo=[],diagnostic={type:'—',cancels:0,frames:0,latency:0,last:performance.now()};
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const journal=()=>({id:uid(),created:new Date().toISOString(),theme:'botanical',template:'blank',strokes:[],text:''});const note=(title='Notebook')=>({id:uid(),title,created:new Date().toISOString(),pages:[{id:uid(),title:'Page 1',template:'grid',strokes:[],text:''}]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db){let old={};try{old=JSON.parse(localStorage.getItem(OLD))||{}}catch{}db={version:2,journal:old,notebooks:{}};if(!Object.keys(db.journal).length){let e=journal();db.journal[e.id]=e}let n=note();db.notebooks[n.id]=n;save()}db.journal||={};db.notebooks||={};db.version=2;return db}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('status').textContent='Saved locally on this device'}catch(e){$('status').textContent='Storage unavailable — make a backup'}refreshLists()}
function current(){return page}function ordered(o){return Object.values(o).sort((a,b)=>(b.created||'').localeCompare(a.created||''))}
function openJournal(id){space='journal';page=db.journal[id]||ordered(db.journal)[0];if(!page){page=journal();db.journal[page.id]=page}undo=[];redo=[];render()}
function notebook(){return db.notebooks[$('notebooks').value]||Object.values(db.notebooks)[0]}function openNote(nid,pid){space='notebook';let n=db.notebooks[nid]||notebook();if(!n)return;page=n.pages.find(p=>p.id===pid)||n.pages[0];undo=[];redo=[];render()}
function refreshLists(){let j=$('journalEntries'),sel=page?.id;j.innerHTML='';ordered(db.journal).forEach(e=>j.add(new Option(new Date(e.created).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+new Date(e.created).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),e.id)));if(space==='journal')j.value=sel;let ns=$('notebooks'),n=notebook();ns.innerHTML='';Object.values(db.notebooks).forEach(x=>ns.add(new Option(x.title,x.id)));if(n)ns.value=n.id;let ps=$('pages');ps.innerHTML='';if(n)n.pages.forEach((p,i)=>ps.add(new Option(p.title||'Page '+(i+1),p.id)));if(space==='notebook')ps.value=page?.id}
function theme(){let t={botanical:['#f7f3e8','#e3e9df','#476551','#688c72','#d6a2ac'],golden:['#f9efe1','#eee0d5','#795c53','#a0a27a','#dc967e'],woodland:['#f2f0e5','#dce5df','#4b665b','#678779','#c3b5c9']}[page.theme||'botanical'];document.documentElement.style.setProperty('--paper',t[0]);document.documentElement.style.setProperty('--outer',t[1]);document.documentElement.style.setProperty('--ink',t[2]);document.documentElement.style.setProperty('--accent',t[3]);let leaf=t[3],flower=t[4],out='';for(const [x,y,r] of [[-24,-15,0],[950,20,180],[-20,780,-18],[960,765,165]]){out+=`<g transform="translate(${x} ${y}) rotate(${r})"><path d="M0 0 C35 80 55 190 115 280" fill="none" stroke="${leaf}" stroke-width="3"/>`;for(let i=0;i<9;i++)out+=`<ellipse cx="${16+i*12}" cy="${38+i*25}" rx="17" ry="8" transform="rotate(${i%2?35:-35} ${16+i*12} ${38+i*25})" fill="${leaf}" opacity=".7"/>`;out+=`<circle cx="72" cy="155" r="11" fill="${flower}" opacity=".75"/></g>`}$('art').innerHTML=out}
function render(){let isJ=space==='journal';$('journalBtn').classList.toggle('active',isJ);$('notebookBtn').classList.toggle('active',!isJ);$('journalControls').classList.toggle('hide',!isJ);$('notebookControls').classList.toggle('hide',isJ);$('rename').classList.toggle('hide',isJ);$('bottomAdd').classList.toggle('hide',isJ);$('paper').classList.toggle('notebook',!isJ);$('art').parentElement.classList.toggle('hide',!isJ);$('pageTitle').textContent=isJ?'My Journal':notebook().title;$('date').textContent=isJ?new Date(page.created).toLocaleString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}):page.title;$('text').value=page.text||'';$('theme').value=page.theme||'botanical';$('template').value=page.template||'blank';$('templateLayer').className='template '+(page.template||'blank');if(isJ)theme();else{document.documentElement.style.setProperty('--paper','#fcfbf7');document.documentElement.style.setProperty('--outer','#e9ece7');document.documentElement.style.setProperty('--ink','#3d4e46');document.documentElement.style.setProperty('--accent','#5e7d72')}refreshLists();resize()}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw()}
function xy(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:typeof e.pressure==='number'&&e.pressure>0?e.pressure:.5}}
function style(s,last){return{w:s.tool==='graphite'?Math.max(.8,s.width*(.45+last.p*.55)):Math.max(1,s.width),a:s.tool==='graphite'?.24+last.p*.45:1}}
/* Every incremental segment starts exactly at the previous endpoint. This makes live and replay paths identical. */
function segment(s,a,b){let w=canvas.clientWidth,h=canvas.clientHeight,q=style(s,b);ctx.save();ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=s.tool==='eraser'?1:q.a;ctx.strokeStyle=s.tool==='graphite'?'#374039':s.color;ctx.lineWidth=s.tool==='eraser'?Math.max(16,s.width*4):q.w;ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x*w,a.y*h);ctx.lineTo(b.x*w,b.y*h);ctx.stroke();ctx.restore()}
function dot(s,p){let w=canvas.clientWidth,h=canvas.clientHeight,q=style(s,p);ctx.save();ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';ctx.fillStyle=s.tool==='graphite'?'#374039':s.color;ctx.globalAlpha=s.tool==='graphite'?q.a:1;ctx.beginPath();ctx.arc(p.x*w,p.y*h,Math.max(.5,q.w/2),0,Math.PI*2);ctx.fill();ctx.restore()}function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let s of page?.strokes||[]){if(s.points.length===1)dot(s,s.points[0]);else for(let i=1;i<s.points.length;i++)segment(s,s.points[i-1],s.points[i])}}
function queue(s,a,b){dirty.push([s,a,b]);if(!raf)raf=requestAnimationFrame(now=>{diagnostic.frames++;diagnostic.latency=Math.round(now-diagnostic.last);diagnostic.last=now;for(let x of dirty)segment(...x);dirty=[];raf=0;showDiagnostics()})}
function collect(e){let s=active?.stroke;if(!s)return;let events=e.getCoalescedEvents?.()||[e];for(let ev of events){let p=xy(ev),a=s.points.at(-1);if(Math.hypot(p.x-a.x,p.y-a.y)>.00025){s.points.push(p);queue(s,a,p)}}}
function begin(e){if(active||$('text')===document.activeElement)return;let pen=e.pointerType==='pen',finger=e.pointerType==='touch';diagnostic.type=e.pointerType;if(finger&&!$('finger').checked)return;if(!pen&&!finger&&e.pointerType!=='mouse')return;e.preventDefault();$('surface').classList.add('writing');canvas.classList.add('writing');try{canvas.setPointerCapture(e.pointerId)}catch{}let p=xy(e),s={id:uid(),tool:tool,color:$('color').value,width:+$('width').value,points:[p]};page.strokes.push(s);active={id:e.pointerId,stroke:s};redo=[];dot(s,p);$('status').textContent=pen?'Writing with Apple Pencil':finger?'Finger drawing':'Writing';showDiagnostics()}
function move(e){if(!active||e.pointerId!==active.id)return;e.preventDefault();collect(e)}
function finish(e,cancelled=false){if(!active||e.pointerId!==active.id)return;if(!cancelled)collect(e);else diagnostic.cancels++;let s=active.stroke;active=null;$('surface').classList.remove('writing');canvas.classList.remove('writing');if(s.points.length)undo.push(s.id);setTimeout(save,0);showDiagnostics()}
canvas.addEventListener('pointerdown',begin,{passive:false});canvas.addEventListener('pointermove',move,{passive:false});canvas.addEventListener('pointerup',e=>finish(e),{passive:false});canvas.addEventListener('pointercancel',e=>finish(e,true),{passive:false});canvas.addEventListener('lostpointercapture',e=>finish(e,true),{passive:false});window.addEventListener('resize',()=>requestAnimationFrame(resize));screen.orientation?.addEventListener('change',()=>setTimeout(resize,80));
function showDiagnostics(){if(!$('diagnostics').classList.contains('hide'))$('diagnostics').textContent=`Input: ${diagnostic.type} · cancellations: ${diagnostic.cancels} · frames: ${diagnostic.frames} · last frame: ${diagnostic.latency}ms`}
function syncOptions(){let v=$('width').value,c=$('color').value,f=$('finger').checked;$('popWidth').value=v;$('popColor').value=c;$('fingerPop').checked=f;$('widthOut').value=v+' px'}
function setTool(v){tool=v;document.body.classList.toggle('typing',v==='type');['ballpoint','graphite','eraser','type'].forEach(x=>$(x).classList.toggle('active',x===v));if(v==='type')$('text').focus();else $('status').textContent=$('finger').checked?'Finger drawing enabled':'Pencil-only mode is on — draw with Apple Pencil';syncOptions()}
['ballpoint','graphite','eraser','type'].forEach(x=>$(x).onclick=()=>{if((x==='ballpoint'||x==='graphite')&&tool===x)$('toolPop').classList.toggle('hide');setTool(x)});$('width').oninput=e=>{syncOptions()};$('color').onchange=syncOptions;$('finger').onchange=()=>setTool(tool);$('popWidth').oninput=e=>{$('width').value=e.target.value;syncOptions()};$('popColor').onchange=e=>{$('color').value=e.target.value;syncOptions()};$('fingerPop').onchange=e=>{$('finger').checked=e.target.checked;setTool(tool)};$('toolOptions').onclick=()=>{$('toolPop').classList.toggle('hide');$('moreMenu').classList.add('hide');syncOptions()};$('more').onclick=()=>{$('moreMenu').classList.toggle('hide');$('toolPop').classList.add('hide')};$('morePrint').onclick=()=>$('print').click();$('moreBackup').onclick=()=>$('backup').click();$('moreRestore').onclick=()=>$('restore').click();$('diagToggle').onclick=()=>{$('diagnostics').classList.toggle('hide');showDiagnostics()};$('text').oninput=()=>{page.text=$('text').value;save()};
function actionUndo(){let s=page.strokes.pop();if(s){redo.push(s);redraw();save()}}function actionRedo(){let s=redo.pop();if(s){page.strokes.push(s);redraw();save()}}$('undo').onclick=actionUndo;$('redo').onclick=actionRedo;
$('journalBtn').onclick=()=>openJournal(page?.id);$('notebookBtn').onclick=()=>openNote();$('journalEntries').onchange=e=>openJournal(e.target.value);$('newJournal').onclick=()=>{let e=journal();db.journal[e.id]=e;openJournal(e.id);save()};$('theme').onchange=e=>{page.theme=e.target.value;save();render()};
function addPage(){let n=notebook(),p={id:uid(),title:'Page '+(n.pages.length+1),template:'grid',strokes:[],text:''};n.pages.push(p);openNote(n.id,p.id);save()}$('notebooks').onchange=e=>openNote(e.target.value);$('pages').onchange=e=>openNote($('notebooks').value,e.target.value);$('newNotebook').onclick=()=>{let n=note(prompt('Notebook title','Notebook')||'Notebook');db.notebooks[n.id]=n;openNote(n.id);save()};$('newPage').onclick=addPage;$('bottomAdd').onclick=addPage;$('rename').onclick=()=>{let n=notebook(),v=prompt('Notebook title',n.title);if(v?.trim()){n.title=v.trim();save();render()}};$('template').onchange=e=>{page.template=e.target.value;save();render()};
$('print').onclick=()=>window.print();$('backup').onclick=()=>{save();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='my-notebook-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x||typeof x!=='object')throw 0;if(!confirm('Import this backup? Existing items are retained unless they have the same ID.'))return;x.journal||=x;db.journal={...db.journal,...(x.journal||{})};db.notebooks={...db.notebooks,...(x.notebooks||{})};save();openJournal()}catch{alert('Unable to read this backup.')}};load();openJournal(ordered(db.journal)[0]?.id);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
